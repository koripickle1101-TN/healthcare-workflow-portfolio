function table(rows,kind){var search=state.search.toLowerCase();rows=rows.filter(function(r){return !search||[r.id,r.payer,r.service,r.reason,r.status].some(function(s){return String(s).toLowerCase().includes(search)})});rows=rows.slice();rows.sort(function(a,b){return state.sort==='charge'?b.charge-a.charge:state.sort==='recent'?b.date-a.date:state.sort==='status'?a.status.localeCompare(b.status):(b.age+(b.denial?45:0)+b.charge/250)-(a.age+(a.denial?45:0)+a.charge/250)});var pages=Math.max(1,Math.ceil(rows.length/12));state.pageIndex=Math.min(state.pageIndex,pages-1);var shown=rows.slice(state.pageIndex*12,(state.pageIndex+1)*12);var html='<div class="tablewrap"><table><thead><tr><th>Claim ID</th><th>Submitted</th><th>Payer</th><th>Service</th><th>Status</th><th>Charge</th><th>Open A/R</th><th>Age</th></tr></thead><tbody>';html+=shown.map(function(r){return '<tr data-case="'+r.id+'" tabindex="0" role="button" aria-label="Inspect '+r.id+'"><td><b>'+r.id+'</b></td><td>'+r.ymd+'</td><td>'+h(r.payer)+'</td><td>'+h(r.service)+'</td><td>'+badge(r.status)+'</td><td>'+money(r.charge)+'</td><td>'+money(r.open)+'</td><td>'+r.age+'d</td></tr>'}).join('');html+='</tbody></table>'+(shown.length?'':'<div class="empty">No matching records. Try a different filter.</div>')+'</div>';html+='<div class="tablefoot"><span>'+small(rows.length)+' records · Page '+(state.pageIndex+1)+' of '+pages+'</span><div><button data-pg="-1" '+(state.pageIndex===0?'disabled':'')+'>Previous</button> <button data-pg="1" '+(state.pageIndex>=pages-1?'disabled':'')+'>Next</button></div></div>';return html}

function denialLab(rows){var denied=rows.filter(function(r){return r.denial&&(state.cause==='all'||r.reason===state.cause)}),total=rows.filter(function(r){return r.denial});var reasonBar=bars(total,'reason',Math.max(1,total.length),'reason');var matrix='<div class="matrix"><div class="cell title">ROOT CAUSE</div>'+payers.map(function(p){return '<div class="cell title">'+p+'</div>'}).join('');var mx=Math.max(1,...payers.flatMap(function(p){return reasons.map(function(re){return total.filter(function(r){return r.payer===p&&r.reason===re}).length})}));reasons.forEach(function(re){matrix+='<div class="cell title">'+h(re)+'</div>';payers.forEach(function(p){var n=total.filter(function(r){return r.payer===p&&r.reason===re}).length;var alpha=.07+.7*n/mx;matrix+='<button class="cell" data-cross="'+h(p)+'|'+h(re)+'" style="border:0;background:rgba(255,130,0,'+alpha.toFixed(2)+')" title="'+n+' demo denials">'+n+'</button>'})});matrix+='</div>';return section('Denial Intelligence','Root-cause Pareto, payer concentration, and a case-level investigation queue','<button data-clear="cause">Clear cause filter</button>')+'<div class="statrow"><div class="statbox"><label>Denied / appealed</label><b>'+small(total.length)+'</b></div><div class="statbox"><label>Denial incidence</label><b>'+percent(pct(total.length,rows.length))+'</b></div><div class="statbox"><label>Selected cause</label><b style="font-size:15px">'+h(state.cause==='all'?'All reasons':state.cause)+'</b></div></div><div class="grid2">'+panel('Root-cause Pareto','Select a cause to filter the worklist',reasonBar,'CLICK TO FILTER')+panel('Payer × denial cause','Select a cell for linked payer-and-cause drilldown',matrix,'INTERACTIVE HEATMAP')+'</div>'+section('Investigation worklist',small(denied.length)+' matching denied and appealed claims')+panel('Claim triage','Select a row to inspect documentation and save a local demo decision',tools(true)+table(denied,'denials'))+'<div class="note">Denial incidence = denied or appealed function arPage(rows){var all=rows.filter(function(r){return r.open>0});var chosen=all.filter(function(r){return state.age==='all'||(state.age==='0–30'?r.age<=30:state.age==='31–60'?r.age>30&&r.age<=60:state.age==='61–90'?r.age>60&&r.age<=90:r.age>90)});var m=metrics(rows);return section('A/R Command Center','Identify aging exposure and drill into unpaid fictional claims','<button data-clear="age">All aging buckets</button>')+'<div class="statrow"><div class="statbox"><label>Gross open charges</label><b>'+compact(m.ar)+'</b></div><div class="statbox"><label>Mean open age</label><b>'+m.age.toFixed(0)+'d</b></div><div class="statbox"><label>Over 90 days</label><b>'+percent(pct(m.old,m.ar))+'</b></div></div><div class="grid2">'+panel('A/R aging by bucket','Click a bar to drill into the underlying claims',agingBars(rows),'FOUR AGE BANDS')+panel('Collections focus','Aging does not equal collectible revenue','<div class="note"><b>High-priority review:</b> investigate older unpaid claims and large balances before attempting a collectability estimate. This demonstration intentionally does not model payer adjustments, write-offs, contracts or partial payments.</div><div style="margin-top:15px" class="statrow"><div class="statbox"><label>Open claims</label><b>'+small(m.openCount)+'</b></div><div class="statbox"><label>90+ gross charges</label><b>'+compact(m.old)+'</b></div></div>','MODEL LIMITS')+'</div>'+section('A/R worklist',small(chosen.length)+' unpaid claims · '+(state.age==='all'?'All aging buckets':state.age+' days'))+panel('Aging drilldown','Click any row to open a fictional claim',tools(true)+table(chosen,'ar'))}
function authPage(rows){var required=rows.filter(function(r){return r.authRequired}),verified=required.filter(function(r){return r.auth}),missing=required.filter(function(r){return !r.auth});var incomplete=rows.filter(function(r){return !r.eligible||!r.doc});var failed=rows.filter(function(r){return !r.clean});var stages=[['Submitted',rows.length],['Intake complete',rows.filter(function(r){return r.eligible&&r.doc}).length],['Authorization verified / not required',rows.filter(function(r){return r.auth}).length],['All synthetic gates passed',rows.filter(function(r){return r.clean}).length]];return section('Authorization-to-Billing QA','An interactive workflow-quality simulation with claim-level evidence')+'<div class="flow">'+stages.map(function(s,i){return '<div class="flowitem"><strong>0'+(i+1)+' / '+h(s[0])+'</strong><b>'+small(s[1])+'</b><small>'+percent(pct(s[1],rows.length))+' of submitted</small></div>'}).join('')+'</div>'+section('Control gates','The stages summarize overlapping control checks; this is not a historical event funnel')+'<div class="grid2">'+panel('Prior authorization readiness','Synthetic claims requiring authorization','<div class="statrow"><div class="statbox"><label>Auth required</label><b>'+small(required.length)+'</b></div><div class="statbox"><label>Verified</label><b>'+small(verified.length)+'</b></div><div class="statbox"><label>Missing</label><b>'+small(missing.length)+'</b></div></div><button class="btn orange" data-auth-missing="1">Inspect missing authorizations →</button>','ACTIONABLE DRILLDOWN')+panel('Intake quality breaks','Eligibility and documentation checks','<div class="statrow"><div class="statbox"><label>Intake incomplete</label><b>'+small(incomplete.length)+'</b></div><div class="statbox"><label>Gate failures</label><b>'+small(failed.length)+'</b></div></div><p class="context">Use the claim inspector to view which validation gates failed. These are synthetic controls, not evidence from an EHR or practice management system. function scenarioPage(rows){var eligible=rows.filter(function(r){return r.denial&&(r.reason==='Eligibility'||r.reason==='Authorization')});var avoided=Math.round(eligible.length*state.denialReduction/100),saved=avoided*state.reworkCost;return section('Scenario Studio','Interactive assumptions, transparent math, and no fabricated savings claims')+'<div class="grid2"><div class="panel"><div class="phead"><div><div class="ptitle">Model an operational change</div><div class="psub">Adjust either assumption. Outputs update immediately.</div></div><span class="chip">WHAT-IF MODEL</span></div><div class="sliderbox"><label for="reduce">Hypothetical denial prevention <strong id="reduceVal">'+state.denialReduction+'%</strong></label><input id="reduce" data-sim="denialReduction" type="range" min="0" max="75" step="5" value="'+state.denialReduction+'"></div><div class="sliderbox"><label for="cost">Assumed administrative rework cost <strong id="costVal">'+money(state.reworkCost)+'</strong></label><input id="cost" data-sim="reworkCost" type="range" min="0" max="150" step="5" value="'+state.reworkCost+'"></div><div class="note">Eligible demonstration population: '+small(eligible.length)+' eligibility/authorization denied claims. No real intervention effect has been measured.</div><button class="btn" data-sim-reset="1">Reset assumptions</button></div><div class="bigresult"><small>HYPOTHETICAL ADMINISTRATIVE COST AVOIDANCE</small><b id="scenarioResult">'+money(saved)+'</b><p id="scenarioDetails">'+small(avoided)+' hypothetical cases avoided × '+money(state.reworkCost)+' assumed rework cost per case</p><hr style="border:0;border-top:1px solid #444;margin:26px 0"><small>ILLUSTRATIVE GROSS CHARGES AFFECTED</small><b style="font-size:29px" id="scenarioCharges">'+compact(eligible.reduce(function(a,r){return a+r.charge},0)*state.denialReduction/100)+'</b><p>Gross charges shown for context. These are NOT projected payments, recoveries, ROI, or guaranteed savings.</p></div></div>'+section('A function qaPage(rows){var ids=group(rows,'id');var validations=[['Unique claim IDs',Object.keys(ids).filter(function(k){return ids[k].length>1}).length],['Missing claim IDs',rows.filter(function(r){return !r.id}).length],['Positive original charge',rows.filter(function(r){return r.charge<=0}).length],['Nonnegative payment amount',rows.filter(function(r){return r.paid<0}).length],['Payments do not exceed charges',rows.filter(function(r){return r.paid>r.charge}).length],['Nonnegative open A/R',rows.filter(function(r){return r.open<0}).length],['Paid claims have no modeled open A/R',rows.filter(function(r){return r.status==='Paid'&&r.open>0}).length],['Denied claims have denial causes',rows.filter(function(r){return r.denial&&!r.reason}).length],['Non-denied claims lack denial causes',rows.filter(function(r){return !r.denial&&r.reason}).length],['Submission dates are not in the future',rows.filter(function(r){return r.date>today}).length]];var flagged=validations.filter(function(x){return x[1]>0}).length;return section('Data Integrity & QA','Inspectable row-level demonstration checks, definitions, and evidence')+'<div class="statrow"><div class="statbox"><label>Validation rules</label><b>'+validations.length+'</b></div><div class="statbox"><label>Passed</label><b>'+ (validations.length-flagged)+'</b></div><div class="statbox"><label>Flagged</label><b>'+flagged+'</b></div></div>'+panel('Rule-level audit','Every rule computes its failing row count from the current filtered population','<div class="tablewrap"><table><thead><tr><th>Rule</th><th>Flagged rows</th><th>Outcome</th></tr></thead><tbody>'+validations.map(function(x){return '<tr><td>'+h(x[0])+'</td><td>'+small(x[1])+'</td><td><span class="badge '+(x[1]?'risk':'ok')+'">'+(x[1]?'REVIEW':'PASS')+'</span></td></tr>'}).join('')+'</tbody></table></div><div style="margin-top:12px"><button class="btn" data-export="quality">Export QA results ↓</button></div>')+section('Definitions and limitations','Know exactly what each metric measures')+panel('Data dictionary','Transparent calculation and scope','<div class="context"><p><b>Denial incidence:</b> denied or appealed claims ÷ submitted claims under the selected global filters.</p><p><b>First-pass clean rate:</b> synthetic eligibility, documentation, authorization and coding checks all passed ÷ submitted claims.</p><p><b>Gross open A/R:</b> original charge amount on unpaid claims. Not net collectible revenue or true days in A/R.</p><p><b>Case decisions:</b> optional notes and review statuses stored only in this browser, not in any server or EHR.</p><p><b>Security:</b> this public demonstration has no authentication, payer API, secure patient-data storage, or HIPAA controls. Never enter PHI.</p></div>')}

bel="Mobile navigation">'+navMarkup(true)+'</nav>'+(state.inspect?drawer(data.find(function(r){return r.id===state.inspect})): '');}
function detail(r){return '<div class="factgrid"><div class="fact"><small>Submitted</small><b>'+r.ymd+'</b></div><div class="fact"><small>Service line</small><b>'+h(r.service)+'</b></div><div class="fact"><small>Original charge</small><b>'+money(r.charge)+'</b></div><div class="fact"><small>Gross open A/R</small><b>'+money(r.open)+'</b></div><div class="fact"><small>Claim age (if unpaid)</small><b>'+r.age+' days</b></div><div class="fact"><small>Denial cause</small><b>'+h(r.reason||'None')+'</b></div><div class="fact"><small>Eligibility verified</small><b>'+ (r.eligible?'Yes':'No')+'</b></div><div class="fact"><small>Authorization</small><b>'+(!r.authRequired?'Not required':r.auth?'Verified':'Missing')+'</b></div><div class="fact"><small>Documentation complete</small><b>'+(r.doc?'Yes':'No')+'</b></div><div class="fact"><small>Coding gate passed</small><b>'+(r.coding?'Yes':'No')+'</b></div></div>'}
function drawer(r){if(!r)return '';var n=notes[r.id]||{owner:'Unassigned',status:'Unreviewed',note:''};return '<div class="overlay" data-overlay="1"><aside role="dialog" aria-modal="true" aria-label="Claim investigation" class="drawer"><div class="drawerhead"><div><div class="eyebrow">SIMULATED CLAIM INVESTIGATION</div><h2>'+r.id+'</h2><div class="context">'+h(r.payer)+' · '+badge(r.status)+'</div></div><button class="btn" data-close="1" aria-label="Close inspector">✕</button></div>'+detail(r)+'<div class="note">This is a completely fictional case. Decisions are stored only in this browser and do not change the claims data.</div><form id="caseform"><div class="formrow"><div class="field"><label>Assign owner</label>'+control('caseowner',owners.map(function(x){return [x,x]}),n.owner)+'</div><div class="field"><label>Review status</label>'+control('casestatus',caseStatuses.map(function(x){return [x,x]}),n.status)+'</div></div><div class="field" style="margin-top:12px"><label for="casenote">Investigation note (no PHI)</label><textarea maxlength="600" id="casenote" placeholder="Document a fictional workflow decision">'+h(n.note)+'</textarea></div><div class="drawerbuttons"><button class="btn orange" type="submit">Save demo decision</button><button class="btn" type="button" data-close="1">Close</button></div></form></aside></div>'}
function getExportRows(){var rows=filtered();if(state.page==='denials')rows=rows.filter(function(r){return r.denial&&(state.cause==='all'||r.reason===state.cause)});if(state.page==='ar')rows=rows.filter(function(r){return r.open>0&&(state.age==='all'||(state.age==='0–30'?r.age<=30:state.age==='31–60'?r.age>30&&r.age<=60:state.age==='61–90'?r.age>60&&r.age<=90:r.age>90))});if(state.search){var search=state.search.toLowerCase();rows=rows.filter(function(r){return [r.id,r.payer,r.service,r.reason,r.status].some(function(v){return String(v).toLowerCase().includes(search)})})}return rows}
function download(rows,name){var headers=Object.keys(rows[0]||{});var csv=[headers.join(',')].concat(rows.map(function(r){return headers.map(function(k){var v=r[k] instanceof Date?r[k].toISOString().slice(0,10):String(r[k]==null?'':r[k]);return '"'+v.replace(/"/g,'""')+'"'}).join(',')})).join('\r\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},250)}
function notify(msg){var old=document.querySelector('.toast');if(old)old.remove();var x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(function(){x.remove()},2600)}
document.addEventListener('click',function(e){var x=e.target.closest('[data-nav],[data-case],[data-close],[data-overlay],[data-payer],[data-reason],[data-cross],[data-age],[data-clear],[data-reset],[data-pg],[data-export],[data-auth-missing],[data-sim-reset]');if(!x)return;var d=x.dataset;if(d.nav){state.page=d.nav;state.pageIndex=0;state.search='';state.cause='all';state.age='all';state.authOnly=false;state.inspect=null;appRender();scrollTo(0,0)}else if(d.case){state.inspect=d.case;appRender()}else if(d.close||d.overlay&&e.target===x){state.inspect=null;appRender()}else if(d.payer){state.payer=d.payer;state.page='denials';state.pageIndex=0;appRender();scrollTo(0,0)}else if(d.reason){state.cause=d.reason;state.page='denials';state.pageIndex=0;appRender()}else if(d.cross){var v=d.cross.split('|');state.payer=v[0];state.cause=v[1];state.pageIndex=0;appRender()}else if(d.age){state.age=d.age;state.page='ar';state.pageIndex=0;appRender();scrollTo(0,0)}else if(d.clear){if(d.clear==='age')state.age='all';else state.cause='all';state.pageIndex=0;appRender()}else if(d.reset){state.period=90;state.payer='all';state.service='all';state.status='all';state.cause='all';state.age='all';state.search='';state.pageIndex=0;appRender()}else if(d.pg){state.pageIndex=Math.max(0,state.pageIndex+Number(d.pg));appRender()}else if(d.export){if(d.export==='quality'){var audit=Array.from(document.querySelectorAll('table tbody tr')).map(function(tr){return {Rule:tr.cells[0].textContent.trim(),'Flagged rows':tr.cells[1].textContent.trim(),Outcome:tr.cells[2].textContent.trim()}});download(audit,'volunteer-careflow-data-audit.csv');notify('Audit CSV exported');return}download(d.export==='all'?filtered():getExportRows(),'volunteer-careflow-synthetic-'+state.page+'.csv');notify('Synthetic CSV exported')}else if(d.authMissing){state.authOnly=true;appRender()}else if(d.simReset){state.denialReduction=25;state.reworkCost=35;appRender()}});
document.addEventListener('change',function(e){if(e.target.dataset.filter){var key=e.target.dataset.filter;if(['period','payer','service','status','sort'].includes(key)){state[key]=key==='period'?Number(e.target.value):e.target.value;state.pageIndex=0;appRender()}}});
document.addEventListener('input',function(e){if(e.target.dataset.sim){state[e.target.dataset.sim]=Number(e.target.value);var a=document.getElementById('reduceVal'),b=document.getElementById('costVal'),c=document.getElementById('scenarioResult'),d=document.getElementById('scenarioDetails'),f=document.getElementById('scenarioCharges');var rows=filtered().filter(function(r){return r.denial&&(r.reason==='Eligibility'||r.reason==='Authorization')});var prevented=Math.round(rows.length*state.denialReduction/100);if(a)a.textContent=state.denialReduction+'%';if(b)b.textContent=money(state.reworkCost);if(c)c.textContent=money(prevented*state.reworkCost);if(d)d.textContent=small(prevented)+' hypothetical cases avoided × '+money(state.reworkCost)+' assumed rework cost per case';if(f)f.textContent=compact(rows.reduce(function(sum,r){return sum+r.charge},0)*state.denialReduction/100)}});
document.addEventListener('submit',function(e){if(e.target.id==='searchform'){e.preventDefault();state.search=document.getElementById('find').value.trim().slice(0,100);state.pageIndex=0;appRender()}else if(e.target.id==='caseform'){e.preventDefault();var owner=document.querySelector('[data-filter="caseowner"]').value,status=document.querySelector('[data-filter="casestatus"]').value,note=document.getElementById('casenote').value.slice(0,600);if(!owners.includes(owner)||!caseStatuses.includes(status))return;notes[state.inspect]={owner:owner,status:status,note:note};try{localStorage.setItem('careflow-demo-notes-v2',JSON.stringify(notes))}catch(err){}state.inspect=null;appRender();notify('Demo case decision saved locally')}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.inspect){state.inspect=null;appRender()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-case]')){e.preventDefault();state.inspect=e.target.dataset.case;appRender()}});
appRender();
})();
</script></body></html>
